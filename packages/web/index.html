<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hive</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #1f2328;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        color: #e6e6e6;
      }
      #app {
        display: flex;
        flex-direction: column;
        flex: 1;
        min-height: 0;
      }
      #board {
        flex: 1;
        position: relative;
        overflow: hidden;
      }
      .hand-strip {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 12px 20px;
        background: #2a2f36;
        border-top: 3px solid transparent;
        border-bottom: 3px solid transparent;
        min-height: 80px;
        box-sizing: border-box;
      }
      .hand-strip.active {
        border-color: #f5d56a;
      }
      .hand-label {
        font-size: 14px;
        text-transform: uppercase;
        letter-spacing: 1px;
        min-width: 60px;
        color: #b0b0b0;
      }
      .hand-strip.active .hand-label {
        color: #f5d56a;
      }
      .hand-slots {
        display: flex;
        gap: 8px;
      }
      .hand-slot {
        width: 56px;
        height: 56px;
        border-radius: 8px;
        border: 2px solid transparent;
        background: #3a3a3a;
        color: #f5e6c8;
        cursor: pointer;
        font-family: inherit;
        font-weight: bold;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2px;
        padding: 0;
        transition: border-color 0.1s, transform 0.1s;
      }
      .hand-white .hand-slot {
        background: #f5e6c8;
        color: #1a1a1a;
      }
      .hand-slot:hover:not(:disabled) {
        transform: translateY(-2px);
      }
      .hand-slot.selected {
        border-color: #f5d56a;
      }
      .hand-slot:disabled {
        opacity: 0.35;
        cursor: default;
      }
      .hand-letter {
        font-size: 22px;
        line-height: 1;
      }
      .hand-count {
        font-size: 11px;
        opacity: 0.75;
      }
      .pass-btn {
        margin-left: auto;
        padding: 10px 18px;
        border: 2px solid #f5d56a;
        border-radius: 8px;
        background: #f5d56a;
        color: #1a1a1a;
        font-family: inherit;
        font-weight: bold;
        font-size: 14px;
        cursor: pointer;
      }
      .pass-btn:hover {
        background: #fce080;
      }
      .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(15, 17, 20, 0.7);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 10;
      }
      .modal {
        background: #2a2f36;
        border-radius: 12px;
        padding: 32px 40px;
        text-align: center;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
        min-width: 280px;
      }
      .modal-title {
        margin: 0 0 8px;
        font-size: 28px;
        color: #f5d56a;
      }
      .modal-subtitle {
        margin: 0 0 24px;
        color: #b0b0b0;
      }
      .modal-cta {
        padding: 12px 32px;
        border: none;
        border-radius: 8px;
        background: #f5d56a;
        color: #1a1a1a;
        font-family: inherit;
        font-weight: bold;
        font-size: 16px;
        cursor: pointer;
      }
      .modal-cta:hover {
        background: #fce080;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
