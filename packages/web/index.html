<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hive</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #1f2328;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        color: #e6e6e6;
      }
      #app {
        display: flex;
        flex-direction: column;
        flex: 1;
        min-height: 0;
      }
      #board {
        flex: 1;
        position: relative;
        overflow: hidden;
      }
      .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(15, 17, 20, 0.7);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 10;
      }
      .modal {
        background: #2a2f36;
        border-radius: 12px;
        padding: 32px 40px;
        text-align: center;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
        min-width: 280px;
      }
      .modal-title {
        margin: 0 0 8px;
        font-size: 28px;
        color: #f5d56a;
      }
      .modal-subtitle {
        margin: 0 0 24px;
        color: #b0b0b0;
      }
      .modal-cta {
        padding: 12px 32px;
        border: none;
        border-radius: 8px;
        background: #f5d56a;
        color: #1a1a1a;
        font-family: inherit;
        font-weight: bold;
        font-size: 16px;
        cursor: pointer;
      }
      .modal-cta:hover {
        background: #fce080;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
