name: PR title

on:
  pull_request:
    types: [opened, edited, reopened]

jobs:
  title:
    runs-on: ubuntu-latest
    steps:
      # The title becomes the squash commit subject, so CLAUDE.md's Git rule is enforced here.
      - env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [[ ! "$TITLE" =~ ^[A-Z][^:]*\ \(#[0-9]+\)$ || "$TITLE" =~ ^S-[0-9] ]]; then
            echo "::error::PR title must be 'Imperative sentence (#<issue>)', no prefix. Got: $TITLE"
            exit 1
          fi
